<div class="title">After <code>processFile()</code> returns</div>
<div class="cols"><div><div class="label">During the call</div><div style="display:flex;align-items:center;gap:16px"><div style="flex:1"><div class="row" style=""><div class="cell purple" style="flex:1;min-width:0px"><div class="big"><code>buffer</code></div><div class="small">local pointer</div></div></div></div><div style="font-size:30px;color:#7c3aed">→</div><div style="flex:1"><div class="row" style=""><div class="cell green" style="flex:1;min-width:0px"><div class="big">int[10000]</div><div class="small">40 KB</div></div></div></div></div></div><div><div class="label">After return</div><div style="display:flex;align-items:center;gap:16px"><div style="flex:1"><div class="row" style=""><div class="cell gray" style="flex:1;min-width:0px"><div class="big">(gone)</div><div class="small">the frame was popped</div></div></div></div><div style="font-size:30px;color:#7c3aed">→</div><div style="flex:1"><div class="row" style=""><div class="cell red" style="flex:1;min-width:0px"><div class="big">int[10000]</div><div class="small">still allocated, no pointer to it</div></div></div></div></div></div></div>
