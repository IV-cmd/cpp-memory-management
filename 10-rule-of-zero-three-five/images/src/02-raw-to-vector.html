<div class="title">Changing one member</div>
<div style="display:flex;align-items:center;gap:16px"><div style="flex:1"><div class="row" style=""><div class="cell red" style="flex:1;min-width:0px"><div class="big"><code>int* data;</code></div><div class="small">I allocate, copy, move and free</div></div></div></div><div style="font-size:30px;color:#7c3aed">→</div><div style="flex:1"><div class="row" style=""><div class="cell green" style="flex:1;min-width:0px"><div class="big"><code>std::vector&lt;int&gt; data;</code></div><div class="small">the vector does all of it</div></div></div></div></div>
