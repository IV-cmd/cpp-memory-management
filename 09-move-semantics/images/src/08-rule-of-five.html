<div class="title">The Rule of Five</div>
<div class="row" style=""><div class="cell orange" style="flex:1;min-width:0px"><div class="big">destructor</div></div><div class="cell blue" style="flex:1;min-width:0px"><div class="big">copy constructor</div></div><div class="cell blue" style="flex:1;min-width:0px"><div class="big">copy assignment</div></div><div class="cell green" style="flex:1;min-width:0px"><div class="big">move constructor</div></div><div class="cell green" style="flex:1;min-width:0px"><div class="big">move assignment</div></div></div><div class="arrow">↓</div><div class="row" style=""><div class="cell purple" style="flex:1;min-width:0px"><div class="big">one resource</div><div class="small">copying, moving and destroying must agree on who owns it</div></div></div>
